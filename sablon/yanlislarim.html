<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>[SİTE ADI] — Yanlışlarım</title>

<meta name="description"
content="[SİTE ADI] — Öğrencinin yanlış yaptığı sorular." />

<link rel="stylesheet"
href="assets/css/style.css?v=2" />
</head>

<body>

<div id="nav-root"></div>

<main>

  <section class="section">
    <div class="container">

      <div class="section-head">

        <span class="eyebrow">
          Kişisel Tekrar Alanın
        </span>

        <h1>❌ Yanlışlarım</h1>

        <p>
          Testlerde yanlış yaptığın soruları burada tekrar
          inceleyebilir, doğru cevapları ve açıklamaları görebilirsin.
        </p>

      </div>

      <div id="wrong-questions-root"></div>

    </div>
  </section>

</main>

<div id="footer-root"></div>
<!-- =====================================================
     ÖĞRENCİ PDF ANALİZ RAPORU
     ===================================================== -->

<section class="student-report-panel">

  <div class="student-report-head">
    <div>
      <h2>📊 Öğrenci Analiz Raporu</h2>
      <p>
        Çözdüğün sorular, kazanım başarıların ve yanlışların
        öğretmen için renkli bir rapora dönüştürülür.
      </p>
    </div>
  </div>

  <div class="student-report-form">

    <div class="report-field">
      <label for="reportStudentName">
        Öğrenci Adı Soyadı
      </label>

      <input
        id="reportStudentName"
        type="text"
        placeholder="Ad Soyad"
      >
    </div>

    <div class="report-field">
      <label for="reportStudentClass">
        Sınıf / Şube
      </label>

      <input
        id="reportStudentClass"
        type="text"
        placeholder="9/A"
      >
    </div>

    <div class="report-field">
      <label for="reportStudentNo">
        Öğrenci No
      </label>

      <input
        id="reportStudentNo"
        type="text"
        placeholder="123"
      >
    </div>

  </div>

  <button
    id="createPdfReportBtn"
    class="btn pdf-report-btn"
    type="button"
  >
    🖨️ PDF Raporu Oluştur
  </button>

</section>


<!-- Yazdırılırken kullanılacak gizli alan -->
<div
  id="studentPrintReport"
  class="student-print-report"
></div>
<script type="module">

  import {
    mountNav,
    mountFooter
  } from "./assets/js/nav.js?v=1";

  import {
    renderWrongQuestions
  } from "./assets/js/wrong-questions.js?v=2";

  mountNav("wrong");

  mountFooter();

  renderWrongQuestions(
    document.getElementById("wrong-questions-root")
  );

</script>

</body>
</html>
